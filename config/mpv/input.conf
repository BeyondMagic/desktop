# ${path}: Full path to the currently playing file.
# ${filename}: Just the name of the file (without the path).
# ${time-pos}: The current playback position in seconds.
# ${working-directory}: The directory mpv was started from. 

ctrl+c run "wl-copy" "-t" "text/plain" "${path}"
r cycle_values video-rotate 90 180 270 0

# Organize current file
F1 run "sort-video.nu" "${path}"
