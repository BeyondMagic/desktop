# kitty.conf — migrated from foot.ini
# Reference: https://sw.kovidgoyal.net/kitty/conf/

# ─── Shell / Terminfo ───────────────────────────────────────────────
# foot used term=xterm-256color; kitty sets TERM itself (xterm-kitty).
# If you need xterm-256color for remote compat, uncomment:
# term xterm-256color

# ==============================================================================
# Kitty Typographic Configuration
# Converted from Foot Terminal Configuration
# ==============================================================================

# Primary Regular Face: VictorMono Nerd Font, Medium Weight
font_family      family="Victor Mono" style="Regular"

# Bold Variant Face: FiraCode NF, Bold Weight
#bold_font        family="Fira Code" style="Medium"
bold_font        family="Victor Mono" style="Bold"

# Italic Variant Face: VictorMono NF, Bold Italic Weight
italic_font      family="Victor Mono" style="Italic"

# Bold-Italic Variant Face: JetBrainsMono Nerd Font, Bold Weight
bold_italic_font family="Victor Mono" style="Bold Italic"

# Typographic Scale: 14.25pt corresponds to 19px on standard 96 DPI displays
font_size 14

font_features VictorMono-Medium +ss01

modify_font cell_height 0px
modify_font cell_width 0px
modify_font baseline 0px

# 2. Map Nerd Font v3+ glyphs to the dedicated Symbols font
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font

# ------------------------------------------------------------------------------
# Secondary Glyph Routing: Noto Color Emoji
# Deterministically routes standard Unicode emoji ranges to Noto Color Emoji.
# Cell metrics are governed by the primary font; Kitty automatically scales
# secondary glyphs to prevent cell overflow without explicit pixel parameters.
# ------------------------------------------------------------------------------
symbol_map U+2600-U+26FF,U+2700-U+27BF,U+2B00-U+2BFF,U+1F1E0-U+1F1FF,U+1F300-U+1F5FF,U+1F600-U+1F64F,U+1F680-U+1F6FF,U+1F900-U+1F9FF,U+1FA70-U+1FAFF Noto Color Emoji

# Japanese character fallback mapping
symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+FF00-U+FFEF,U+4E00-U+9FAF Noto Sans CJK JP

# ------------------------------------------------------------------------------
# OpenType Features and Rasterization Controls
# FreeType hinting is governed via ~/.config/fontconfig/fonts.conf.
# Ligatures are enabled by default for programming fonts (e.g., Fira Code).
# ------------------------------------------------------------------------------
disable_ligatures never
text_composition_strategy platform
# Emoji fallback (kitty handles fallback automatically, but you can force it):
symbol_map U+1F300-U+1FAFF Noto Color Emoji
symbol_map U+2600-U+26FF,U+2700-U+27BF Noto Color Emoji

# ─── Window ─────────────────────────────────────────────────────────
# foot: pad=20x20 → kitty uses pts, not px
window_padding_width 14
# (20px ≈ 15pt at 96dpi)

# foot: initial-window-size-pixels=700x500 (commented out)
# initial_window_width  700
# initial_window_height 500

# ─── Bell ───────────────────────────────────────────────────────────
enable_audio_bell no
# foot: urgent=no / notify=no / visual=no were defaults, so omitted.
# If you want the visual bell instead:
#visual_bell_duration 0.1

# ─── Scrollback ─────────────────────────────────────────────────────
# foot: lines=1000 (commented, default 1000)
scrollback_lines 1000

# ─── URL handling ───────────────────────────────────────────────────
# foot: launch=xdg-open ${url}
open_url_with xdg-open
# kitty also detects URLs and opens with the OS handler by default.

# ─── Cursor ─────────────────────────────────────────────────────────
# foot: style=block (commented, default block)
cursor_shape block
# foot: blink=no (commented, default no)
cursor_blink_interval 0
# foot: beam-thickness=1.5
cursor_beam_thickness 1.5
# foot: underline-thickness=<font metrics>
cursor_underline_thickness 2.0

# ─── Mouse ──────────────────────────────────────────────────────────
# foot: hide-when-typing=no (commented, default no)
mouse_hide_wait 0
# foot: alternate-scroll-mode=yes (commented, default yes)
# kitty handles alternate scroll natively; no equivalent needed.

# ─── Touch ──────────────────────────────────────────────────────────
# foot: long-press-delay=300
# kitty has no direct equivalent; touch scrolling is handled via:
touch_scroll_multiplier 1.0

# ─── Colors (Catppuccin Mocha-inspired) ─────────────────────────────
# foot: [colors-dark] alpha=1.0
background_opacity 1.0

foreground #dee6f4
background #010101

# Cursor colors (foot: color=<inverse fg/bg>)
cursor #dee6f4
cursor_text_color #010101

# Selection (foot: selection-foreground/background = inverse)
selection_foreground #010101
selection_background #dee6f4

# URL highlighting (foot: urls=<regular3> = f9e2af)
url_color #f9e2af
url_style curly

# Normal colors
color0  #45475a
color8  #5B5D7A
color1  #f38ba8
color9  #FFA8B7
color2  #a6e3a1
color10 #B0FFA1
color3  #f9e2af
color11 #FFEDA1
color4  #89b4fa
color12 #8BB4FF
color5  #f5c2e7
color13 #FFD2EB
color6  #94e2d5
color14 #A9F2E1
color7  #bac2de
color15 #C2CAE6

# ─── Key bindings ───────────────────────────────────────────────────
# foot: clipboard-copy=Control+c
# kitty uses ctrl+shift+c by default; override:
#map ctrl+c copy_to_clipboard
# foot: clipboard-paste=Control+v
map ctrl+v paste_from_clipboard

map ctrl+c copy_to_clipboard
map ctrl+shift+c send_text all \x03

map ctrl+shift+v

# foot: search-start=Control+f
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting fzf --ansi --no-sort --no-mouse --exact -i --tac

# foot: font-increase=Control+plus Control+equal Control+KP_Add
map ctrl+plus  increase_font_size
map ctrl+equal increase_font_size
map ctrl+kp_add increase_font_size

# foot: font-decrease=Control+minus Control+KP_Subtract
map ctrl+minus    decrease_font_size
map ctrl+kp_subtract decrease_font_size

# foot: font-reset=Control+0 Control+KP_0
map ctrl+0    reset_font_size
map ctrl+kp_0 reset_font_size

# map ctrl+shift+n new_tab_with_cwd
# map ctrl+shift+n launch --cwd=current --type=window
map ctrl+shift+n launch --cwd=current --type=os-window

# ─── CSD (window decorations) ──────────────────────────────────────
# foot: [csd] preferred=server / size=26 / etc.
# kitty uses its own window decorations on Wayland:
hide_window_decorations no
# To hide titlebar only:
# hide_window_decorations titlebar-only

# ─── Misc / Tweak ──────────────────────────────────────────────────
# foot: [tweak] allow-overflowing-double-width-glyphs=true
# kitty equivalent:
# (kitty renders double-width glyphs natively; no direct toggle needed)
