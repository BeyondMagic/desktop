# configuration: https://yazi-rs.github.io/docs/configuration/yazi/

[mgr]
show_symlink = false
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true
mouse_events = [ "click", "scroll", "touch", "move", "drag" ]

[open]
prepend_rules = [
    # Explicitly block directories from being caught by editor open rules
    # { url = "*/", use = [] },

	# SVG first – more specific than image/*
    { url = "*.svg", use = [ "gallery", "inkscape", "vectorcraft", "photocraft" ] },

    # All other images
    { mime = "image/*", use = [ "gallery", "photocraft", "inkscape" ] },

    { mime = "video/*", use = "playlist" },
    { mime = "audio/*", use = "playlist" },
    { mime = "text/html", use = "xdg-open" },

	{
		url = "*.{mp3,flac,wav,mp4,mkv,avi}",
		use = "playlist"
	},
	{
		url = "*.{jpg,jpeg,png,gif,webp}",
		use = "gallery"
	},
	{
		url = "*.{rnote}",
		use = "rnote"
	}
]

[opener]
playlist = [
	{
		run = 'mpv --force-window %s',
		desc = "Open as playlist",
		orphan = true,
		for = "unix"
	}
]

inkscape = [
	{
		run = 'inkscape %s',
		desc = "Open with inkscape",
		orphan = true,
		for = "unix"
	}
]

vectorcraft = [
	{
		run = 'vectorcraft %s',
		desc = "Open with vectorcraft",
		orphan = true,
		for = "unix"
	}
]

photocraft = [
	{
		run = 'photocraft %s',
		desc = "Open with photocraft",
		orphan = true,
		for = "unix"
	}
]

gallery = [
	{
		run = 'swayimg %s',
		desc = "Open on image viewer (swayimg)",
		orphan = true,
		for = "unix"
	}
]

rnote = [
	{
		run = 'rnote %s',
		desc = "Open rnote",
		orphan = true,
		for = "unix"
	}
]

xdg-open = [
	{
		run = 'xdg-open %s',
		desc = "Use xdg-open",
		orphan = true,
		for = "unix"
	}
]
